name: Compile mainline kernel on a server

on:
  #自动编译：每个星期二早上4点
#  schedule:
#    - cron: 0 16 * * 2,5
  #推送代码编译
  #push:
  repository_dispatch:
  workflow_call:
    inputs:
      kernel_source:
        description: "Upstream kernel source (owner, owner/repo, or owner/repo@branch)"
        required: false
        type: string
        default: "unifreq"
      kernel_version:
        description: "input kernel version"
        required: true
        type: string
        default: "6.18.y"
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Select the kernel source"
        required: false
        default: "unifreq"
        type: choice
        options:
          - unifreq
          - ophub
      kernel_version:
        description: "Select kernel version"
        required: false
        default: "6.18.y"
        type: choice
        options:
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y
          - all
      kernel_auto:
        description: "Auto use the latest kernel"
        required: false
        default: true
        type: boolean
      auto_patch:
        description: "Auto apply patch"
        required: false
        default: true
        type: boolean
      delete_source:
        description: "Delete the source after compilation"
        required: false
        default: true
        type: boolean
      kernel_package:
        description: "Select compile package list"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dtbs
      kernel_toolchain:
        description: "Select the compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - clang
          - gcc
          - gcc-15.3
          - gcc-15.2
          - gcc-14.2
          - gcc-14.3
      ccache_clear:
        description: "Set whether to clear the cache"
        required: false
        default: false
        type: boolean
      docker_image:
        description: "Select Armbian docker image"
        required: false
        default: "resolute"
        type: choice
        options:
          - trixie
          - bookworm
          - resolute
          - noble
      kernel_sign:
        description: "Set the kernel custom signature"
        required: false
        default: "-laiyujun"
        type: choice
        options:
          - -laiyujun
          - -ophub
          - -happy-new-year
          - -happy-national-day
          - -yourname
      kernel_config:
        description: "Set the path of kernel .config"
        required: false
        default: "kernel-config/release/stable"
        type: choice
        options:
          - kernel-config/release/stable
          - false
      kernel_patch:
        description: "Set the directory for kernel patches"
        required: false
        default: "kernel-patch/beta"
        type: choice
        options:
          - kernel-patch/beta
          - false

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    name: build kernel for ${{ inputs.kernel_version }}
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: write

    env:
      KERNEL_SOURCE: ${{ inputs.kernel_source || 'unifreq' }}
      KERNEL_VERSION: ${{ inputs.kernel_version || 'all' }}
      KERNEL_AUTO: ${{ inputs.kernel_auto != false }}
      AUTO_PATCH: ${{ inputs.auto_patch != false }}
      DELETE_SOURCE: ${{ inputs.delete_source != false }}
      KERNEL_PACKAGE: ${{ inputs.kernel_package || 'all' }}
      KERNEL_TOOLCHAIN: ${{ inputs.kernel_toolchain || 'gcc' }}
      CCACHE_CLEAR: ${{ inputs.ccache_clear == true }}
      DOCKER_IMAGE: ${{ inputs.docker_image || 'resolute'}}
      KERNEL_SIGN: ${{ inputs.kernel_sign || '-laiyujun' }}
      KERNEL_CONFIG: ${{ inputs.kernel_config || 'kernel-config/release/stable' }}
      KERNEL_PATCH: ${{ inputs.kernel_patch || 'kernel-patch/beta' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          #sudo apt-get -y full-upgrade
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }
          
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"
          
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Get kernel source commit hash
        id: kernelhash
        run: |
          # Resolve the source the same way as the compile action (-r owner/repo@branch).
          # With only an owner, the action uses owner/linux-<x.y>.y@main.
          input_r_value="${KERNEL_SOURCE#https://github.com/}"
          code_owner="$(echo "${input_r_value}" | awk -F '@' '{print $1}' | awk -F '/' '{print $1}')"
          code_repo="$(echo "${input_r_value}" | awk -F '@' '{print $1}' | awk -F '/' '{print $2}')"
          code_branch="$(echo "${input_r_value}" | awk -F '@' '{print $2}')"
          [[ -n "${code_branch}" ]] || code_branch="main"

          first_kernel="${KERNEL_VERSION%%_*}"
          if [[ -z "${first_kernel}" || "${first_kernel}" == "all" ]]; then
            source_hash="${GITHUB_SHA}"
          else
            main_line="$(echo "${first_kernel}" | awk -F '.' '{print $1"."$2}')"
            [[ -n "${code_repo}" ]] || code_repo="linux-${main_line}.y"
            api_url="https://api.github.com/repos/${code_owner}/${code_repo}/git/ref/heads/${code_branch}"
            source_hash="$(curl -fsSL -m 20 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "${api_url}" |
                python3 -c 'import json,sys; print(json.load(sys.stdin).get("object", {}).get("sha", ""))' 2>/dev/null || true)"
          fi
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${GITHUB_SHA}"
          echo "SOURCE_HASH=${source_hash}" >> ${GITHUB_ENV}
          echo "Using source ${code_owner}/${code_repo}@${code_branch} for ${first_kernel:-all}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/ccache
          key: kernel-stable-${{ env.KERNEL_TOOLCHAIN }}-${{ env.KERNEL_VERSION }}-${{ env.SOURCE_HASH }}
          restore-keys: |
            kernel-stable-${{ env.KERNEL_TOOLCHAIN }}-${{ env.KERNEL_VERSION }}-

      - name: Compile the kernel [ ${{ env.KERNEL_VERSION }} ]
        uses: ophub/amlogic-s9xxx-armbian@main
        if: ${{ steps.kernelhash.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: kernel
          kernel_source: ${{ env.KERNEL_SOURCE }}
          kernel_version: ${{ env.KERNEL_VERSION }}
          kernel_auto: ${{ env.KERNEL_AUTO }}
          delete_source: ${{ env.DELETE_SOURCE }}
          kernel_package: ${{ env.KERNEL_PACKAGE }}
          kernel_toolchain: ${{ env.KERNEL_TOOLCHAIN }}
          kernel_sign: ${{ env.KERNEL_SIGN }}
          kernel_config: ${{ env.KERNEL_CONFIG }}
          kernel_patch: ${{ env.KERNEL_PATCH }}
          ccache_clear: ${{ env.CCACHE_CLEAR }}
          docker_hostpath: /builder
          docker_image: ophub/armbian-${{ env.DOCKER_IMAGE }}:arm64

      - name: Upload Kernel to Release
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_stable
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            The kernel can be used to compile Armbian and OpenWrt with oaf driver.
            The kernel source code comes from: ${{ env.KERNEL_SOURCE }}
            The kernel compilation toolchain: ${{ env.KERNEL_TOOLCHAIN }}
